name: stitchhub
description: A tailor marketplace app connecting customers with local tailors
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  
  # State Management
  provider: ^6.1.1
  
  # Database & Auth
  supabase_flutter: ^2.6.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  js: ^0.7.1
  
  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.0.1
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  record: ^5.2.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.2
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Notifications
  flutter_local_notifications: ^19.4.2
  
  # Utilities
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.2.1
  connectivity_plus: ^6.0.5
  share_plus: ^10.0.0
  
  # Maps
  google_maps_flutter: ^2.5.3
  url_launcher: ^6.3.2
  android_intent_plus: ^5.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  social_media_recorder: ^1.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
dependency_overrides:
  record_platform_interface: 1.1.0
  uuid: ^4.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  




